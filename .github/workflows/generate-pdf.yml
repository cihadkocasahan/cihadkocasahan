name: Generate PDF CVs and Release

on:
  push:
    branches:
      - master
    paths:
      - 'CV_*.md'
      - '.github/workflows/generate-pdf.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate PDFs natively via npx
        run: |
          # Process only CV markdown files directly
          npx -y md-to-pdf ./CV_*.md

      - name: Collect Release Assets
        run: |
          mkdir -p final_assets
          mv ./CV_*.pdf final_assets/
          ls -la final_assets/

      - name: Create Release and Upload All Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: latest
          name: Professional CV Documents (Latest)
          make_latest: true
          draft: false
          prerelease: false
          files: |
            final_assets/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
